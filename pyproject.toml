[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.5.0"
description = "Навчальна пошукова система: інвертований індекс, Boolean-пошук і ранжування"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.5", "pyright>=1.1.380", "build>=1.2", "matplotlib>=3.8", "psutil>=5.9"]

[project.scripts]
findex = "findex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: tests that take longer than one second"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
